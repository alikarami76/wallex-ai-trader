# Fee-aware uptrend pullback for the Wallex hackathon credit account.
# Secrets stay in the environment: WALLEX_API_KEY, WALLEX_SUBACCOUNT_ID,
# LLM_BASE_URL, LLM_API_KEY, LLM_MODEL.

exchange:
  base_url: https://api.wallex.ir
  package_id: 183
  timeout_seconds: 20
  max_retries: 4

account:
  initial_equity_tmn: 5000000

fees:
  # Tier-1 TMN spot. Live mode replaces these with GET /v1/account/fee when the key works.
  maker_rate: 0.0025
  taker_rate: 0.0030
  slippage_bps: 3

universe:
  candidates:
    - USDTTMN
    - BTCTMN
    - ETHTMN
    - XAUTTMN
    - XRPTMN
    - DOGETMN
    - SOLTMN
    - BNBTMN
  max_symbols: 6
  min_quote_volume_tmn: 8000000000
  max_spread_bps: 22
  # Depth snapshot from 2026-10-22. Live mode replaces this with the current book.
  spread_bps_snapshot:
    USDTTMN: 1.8
    BTCTMN: 16.3
    ETHTMN: 18.9
    XAUTTMN: 10.4
    XRPTMN: 18.8
    DOGETMN: 8.9
    SOLTMN: 24.4
    BNBTMN: 31.0

strategy:
  ema_fast: 8
  ema_slow: 24
  pullback_bars: 4
  pullback_roc_max: -0.004
  pullback_roc_min: -0.025
  trend_bars: 24
  trend_roc_min: 0.01
  # Moskowitz, Ooi and Pedersen time-series momentum, on a 3-day window.
  # A prior floor of zero, not a fitted threshold.
  slow_bars: 72
  slow_roc_min: 0.0
  rsi_period: 14
  atr_period: 14
  max_atr_pct: 0.03
  # Researched 24h drift of this setup, before fees. Not a per-trade forecast.
  expected_gross: 0.009
  edge_multiple: 1.2
  min_micro_return: -0.004
  entry_size_fraction: 0.12
  imbalance_block: -0.55

execution:
  # Join the bid (maker). A marketable limit is the old taker entry and is off.
  # Stops still cross the spread. quote_gamma is the Avellaneda-Stoikov inventory weight.
  entry: limit_maker
  exit: limit_maker
  stop_slippage_bps: 5
  quote_gamma: 0.5

risk:
  max_fraction_per_trade: 0.12
  max_fraction_per_symbol: 0.12
  # Quarter-Kelly. p and payoff are priors (Kelly 1956; Thorp). The 12% caps still bind.
  kelly_fraction: 0.25
  kelly_win_prob: 0.55
  kelly_payoff: 1.0
  max_gross_exposure: 0.30
  max_positions: 2
  stop_loss_pct: 0.045
  time_stop_hours: 24
  trail_arm_pct: 0.025
  trail_distance_pct: 0.012
  cooldown_after_stop_seconds: 21600
  max_orders_per_hour: 8
  max_entries_per_hour: 2
  daily_max_drawdown: 0.015
  global_max_drawdown: 0.03
  min_notional_tmn: 50000
  min_confidence: 0.55

liquidation:
  deadline: "2026-10-23T23:50:00+03:30"
  start_before_minutes: 60
  aggressive_before_minutes: 30
  flat_by: "2026-10-23T23:30:00+03:30"
  min_hours_to_enter: 8

llm:
  # BoxAPI (OpenAI-compatible). The key stays in LLM_API_KEY.
  # Allowed models: gpt-5-mini (default), gpt-5.4-mini, gpt-5.6-sol, gpt-6-sol, gpt-6.1-sol.
  # gpt-5-mini rejects `temperature`, so it is not sent unless send_temperature is true.
  enabled: true
  timeout_seconds: 20
  send_temperature: false
  temperature: 0.1
  send_response_format: false
  # $3 competition budget. One batched call per cycle, then the deterministic fallback.
  max_llm_calls_per_hour: 2
  max_llm_calls_total: 24
  max_spend_usd: 2.50
  assumed_input_usd_per_million: 0.50
  assumed_output_usd_per_million: 2.00
  assumed_usd_per_call_if_usage_missing: 0.08
  cache_seconds: 3600
  usage_path: data/llm_usage.json

mcp:
  enabled: true
  url: https://api.wallex.ir/mcp
  timeout_seconds: 8
  refresh_seconds: 600

runtime:
  loop_interval_seconds: 60
  candle_refresh_seconds: 300
  history_days: 29

validation:
  # Families inspected before this rule was locked: breakout, continuation,
  # cross-sectional momentum, dip reversal, tight-stop pullback, this one.
  folds: 3
  n_trials: 6
  warmup_bars: 80
